id = "nohurtcam"
kind = "native-mod"
name = "Nohurtcam"
summary = "Removes the camera tilt and shake when you take damage."
description = """
NoHurtCam removes the camera tilt and shake that plays when you take damage.
Your view stays steady while you are hit, which helps in PvP and when aiming.

- Only the damage tilt is removed. View bobbing, the death tilt and camera shake from other mods stay as they are.
- Client side only, it changes nothing for other players.
- It is a native mod: Horizon builds it into the game from source, so the first build takes a while."""
