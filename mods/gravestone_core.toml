id = "gravestone_core"
kind = "native-mod"
name = "Gravestone"
summary = "Spawns a gravestone upon death to safely store your inventory and gives you a readable obituary book. Requires Gravestone (assets)."
description = """
A native Rust implementation of **Gravestone** for the Horizon engine and mod loader. When a player dies, a gravestone spawns at their death coordinates to safely store their entire inventory, armor, offhand, and hotbar.

> **Requirement:** This is the native logic module (`gravestone_core.hnmod`). You **must also install** the companion **`gravestone`** content mod (`.hmod`) for the block, items, 3D models, and localizations to appear and function correctly in-game.

### Features
- **Safe Loot Storage:** Automatically places a gravestone on death to protect dropped items from despawning, fire, or explosions.
- **Slot-Accurate Restoration:** Break the gravestone or interact with it (`Shift + Right-Click`) to return all items and equipment directly into their original slots.
- **Interactive Obituary Book:** Grants an obituary item on spawn that opens a custom book screen displaying exact death coordinates, dimension, timestamp, and lost items.
- **Bilingual Support:** Full native support for English (`en_us`) and Russian (`ru_ru`).

### Credits & License
- **wareal-nah** — Rust code, custom GUI, and Horizon port (MIT License)
- **PneumonoIsNotAvailable** — Gravestone 3D model and textures used in the companion asset module [Gravestone (assets)](https://github.com/PneumonoIsNotAvailable/Gravestones) (MIT License)"""
