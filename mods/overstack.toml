id = "overstack"
kind = "native-mod"
name = "Overstack for Horizon"
summary = "Raises stackable items to 999 per slot while preserving normally unstackable items."
description = """
Overstack raises the maximum stack size of stackable items to 999. Items that normally stack to one remain unstackable.

Install the native mod with Horizon Launcher. Requires Horizon Rust Edition at commit `9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0` and Minecraft version 26.3."""
