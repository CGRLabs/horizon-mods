id = "extremeexplosions2"
kind = "native-mod"
name = "Extreme Explosions 2"
summary = "Ten generations of TNT, each one bigger, more destructive and more spectacular than the last."
description = """
Other TNT mods make a bigger hole. Extreme Explosions 2 puts on a show. Every tier comes with its own effects: fireballs, shockwaves, mushroom clouds, lightning storms, plasma, fire twisters, and finally the earth-shattering TNT Gen X.
Craft your way up from normal TNT to TNT Gen X. Each generation has its own colour and its number in Roman numerals on the side, so you always know what you're about to set off.
From Gen VI upwards, the TNT doesn't just blow a round hole. It tears out a ragged, bowl-shaped crater that rips outward from the blast over about a second, in step with the shockwave. Water and lava pour into the hole, sand and gravel tumble down the sides, and any TNT caught in the blast goes up in a chain reaction.
"""
