id = "hcef"
kind = "native-mod"
name = "HCEF"
summary = "A Chromium browser (CEF) for Horizon mods. A library: other mods use it to show web pages."
description = """
**HCEF** gives Horizon mods a real web browser (Chromium, through CEF), as MCEF does for
Minecraft mods. It is a library: by itself it adds nothing to the game. Mods that show web
pages, such as WebDisplays, need it.

## The browser is downloaded separately

A native mod holds source code only, and Chromium is far too large for that. So the browser
is a separate program, `hcef-host`, that the mod downloads **only when you ask for it**:

1. Install HCEF and build.
2. In the game, open **Options > Mods > HCEF** and click the button.
3. The browser (188 MB) is downloaded from this mod's GitHub releases, checked against a
   size and a SHA-256 compiled into the mod, and unpacked into the mod's data folder.
   Any other file is refused.

Nothing is downloaded before that click.

## What the mod does, and what it does not

It does:

- **Download one file**, when you click the button: the browser archive, over HTTPS, from
  `github.com/J8-Diablo/HCEF/releases`. Its SHA-256 is pinned in the source
  (`host_release.rs`).
- **Start one program**, `hcef-host.exe`, from its own data folder, when a mod first needs a
  browser, and stop it with the game.
- **Talk to that program** on this computer only: a socket on 127.0.0.1 with a random token,
  and shared memory for the pictures.
- **Write files** only in its data folder (`horizon-mods/.horizon-mod-data/hcef`).

It does not:

- download, update or run anything by itself, before or after that click;
- open any page on its own: the browser loads only the addresses other mods give it, which
  is network access, as in any browser;
- read your game account, your files or your other browsers' data: the browser keeps its own
  profile (cookies, cache) in the mod's data folder.

The source of `hcef-host` is in the same repository (`host/`); the archive also holds the
licences of CEF and Chromium.

## Good to know

- Windows x64 only for now.
- H.264 and AAC play, so YouTube and Twitch live streams work.

## For mod authors

In your `horizon-mixin.toml`:

    [dependencies]
    hcef = "^0.1"

The launcher then gives your crate `hcef`: starting the browser process, creating browsers,
reading their pictures from shared memory and placing their sound. See the repository's
README.
"""
