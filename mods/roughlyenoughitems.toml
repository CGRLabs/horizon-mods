changelog = "Every mod's recipes by themselves: content mods' and data packs' recipes of every type show in REI with no work from the mod — vanilla types in REI's own tabs, a mod's own types (a workbench, a grinder) in a tab each, read from the recipe files whatever their shape (inputs with tags and components, grids up to 5x5, outputs with chances and count ranges, fluids as buckets with their amount, time, experience, energy; an unknown field never hides a recipe), with its station when an item has the type's name; on a Horizon server with REI the server's recipes, data packs included, come to the player. Mods that describe their recipes through Horizon's shared hook (native_recipe_categories) get their own tabs, names, stations and notes; other mods can ask REI to open an item's recipes or uses (native_recipe_lookup), and a guide book that asks comes back when REI closes. Tooltips name the installed mod; @ search finds it by name or id (@farmersdelightaddons). Built for Horizon Nightly 2026-11-13 (9f42064). Replaces 1.1.3 (#1004)."

