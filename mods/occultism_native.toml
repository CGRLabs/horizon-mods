changelog = "First registry submission. An alpha port of Occultism by klikli-dev, with their permission: ritual circles with the crusher, storage, repair, sacrifice and summoning rituals, spirit names, the unbound Afrit and Marid with Occultism's models, the Demonic Altar, spirit fire and Demon's Dream, iesnium and otherworld wood through the Third Eye, dimensional storage with wormholes, the Accessor and hopper pulls, and the dimensional mineshaft. Pinned to Horizon Nightly 2026-11-13 (`9f42064`) and Horizon Mixins `5a64af9`; built from the release file and tested in game with launcher 0.2.63, beside occultism 0.6.0-alpha.1. Source: https://github.com/Dawnforger/occultism-horizon/tree/v0.6.0-alpha.1"
