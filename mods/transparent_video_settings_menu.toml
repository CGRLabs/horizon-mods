id = "transparent_video_settings_menu"
kind = "native-mod"
name = "Transparent video settings menu for Horizon"
summary = "You can now see shader changes in real time directly from the settings menu."
description = """
The in-game video settings screen obscures your view: the background darkens and a blur effect is applied, which means you have to close and reopen the menu every time you want to check the impact of a change. This mod disables these visual elements once the game world has loaded.
"""
