changelog = "Shows every mod's recipes: categories other native mods publish (Horizon's `native_recipe_categories`: Farmer's Delight + Addons' cooking pot, cutting board, stove and skillet, juicer) and, with no plugin at all, a tab for every other recipe type the game knows (content mods, data packs) read from the recipe files — patterns, tags, exact stacks, results with chances and amounts, fluids, time, experience, energy; unreadable parts named, never hidden. Dyeing recipes in the crafting tab; the server sends every recipe type to Horizon clients. R/U and station uses find them; other mods' screens can open recipes in JEI. Includes 1.1.4 (Nightly 2026-11-13). Replaces 1.1.4 (#998)."

