description = """
## 中文

Storage Drawers 的非官方 Horizon 移植版，为游戏添加多种储物抽屉、压缩抽屉、升级、钥匙、抽屉管理器以及镶框桌和自定义外观。

模组提供中文和英文资源，支持通过管理器和自动化接口存取物品。部分功能和兼容性仍在完善中。


## English

An unofficial Storage Drawers port for Horizon, adding drawers, compacting drawers, upgrades, keys, controllers, a framing table, and customizable appearances.

The mod includes Chinese and English resources and supports storage access through controllers and automation interfaces. Some features and compatibility are still being improved.


