id = "petalveil"
kind = "shader"
name = "Petalveil"
summary = "lightweight shader pack that keeps vanilla's own light as its base"
description = "Petalveil is a lightweight shader pack for Horizon that keeps vanilla's own light as its base — albedo × tint × lightmap, exactly as without a pack — so caves, torchlight and night stay untouched. On top of that it adds sun, moon and cloud shadows, sun and moon rays, volumetric light shafts, a pastel sky with a rainbow after rain, water with waves, reflections, caustics and glitter, and plants in the wind. Every effect has its own switch or slider."
