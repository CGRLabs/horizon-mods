changelog = """
**Fixes:**
- **Shift + scroll (MC-121772).** Lists scroll again; the hotbar keeps its usual
  direction with Shift held.
- **One wheel click = one notch.** macOS acceleration no longer turns one click
  into several.
- **Trackpad / Magic Mouse flicks.** Grouped into 1–2 notches, scale-aware, so the
  same flick moves the same on Retina and 1× displays.

**Known limits:** no momentum gating yet (inertia can still move the hotbar); no
Cmd-for-drop because Cmd+Q quits; deliberately not a parity mod."""
