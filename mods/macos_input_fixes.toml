id = "macos_input_fixes"
kind = "native-mod"
name = "macOS input fixes for Horizon"
summary = "An unofficial native-mod port of MCMacOSInputFixes to Horizon"
description = """
An unofficial native-mod port of [MCMacOSInputFixes](https://github.com/hamarb123/MCMacOSInputFixes)
by Hamish Arblaster to Horizon.

- **Shift + scroll (MC-121772):** macOS moves a wheel event's vertical delta onto
  the horizontal axis; the mod folds it back, so lists scroll and the hotbar keeps
  its usual direction.
- **One wheel click = one notch:** legacy wheel acceleration no longer turns one
  click into several.
- **Trackpad / Magic Mouse:** precise flicks are grouped into 1–2 notches,
  scale-aware, so the same flick moves the same on Retina and 1× displays.

Options live in `<game home>/config/macos_input_fixes.toml`, read once at startup:
reverse scrolling/hotbar, lock while attacking, hotbar merge. No in-game settings
page yet.

Momentum/inertia gating is not included (M4), so inertia can still move the hotbar
after the fingers lift. This is deliberately not a parity mod.

Own code is MIT; the ported behaviour is BSD-3-Clause, © 2022 Hamish Arblaster.
Not affiliated with the original author, Mojang, Microsoft or the Horizon project."""
