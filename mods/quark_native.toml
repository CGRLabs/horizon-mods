id = "quark_native"
kind = "native-mod"
name = "Quark (native)"
summary = "The behaviour, config and recipes of Quark's blocks and tweaks. Requires the mod Quark."
description = """
Native part of the independent port of [Quark](https://github.com/VazkiiMods/Quark) by Vazkii and the Quark team to Horizon. Not affiliated with or endorsed by them.

**Both projects are required:** this native mod and the content mod **Quark** (its blocks, items and textures).

What it does:
- **Blocks:** placement and neighbour updates of vertical slabs, posts, hedges, stools and the rest; rope pulling up and down (and from a dispenser); sitting on stools; filling and emptying the new flower pots; copper vertical slabs ageing and waxing; leaf colours on hedges and leaf carpets; climbing inside hollow logs; how fire takes each block.
- **Tweaks:** double doors open together, right-click harvesting, hoe harvesting, ladders drop down, note blocks chime on amethyst, map washing, renewable spore blossoms, scaffolding replacing, petting dogs, pig litters, safer rabbits and slimes, slimes to magma cubes, concrete powder stays on magma, glass shards, two slabs back into a block, utility recipes, automatic recipe unlock.
- **Config:** the original's `config/quark-common.toml`, with the same module switches and options; turning a module off removes its recipes and behaviour.

Native mods are compiled into the game and are not sandboxed. Licensed under CC BY-NC-SA 3.0, same as the original: not for commercial use."""
