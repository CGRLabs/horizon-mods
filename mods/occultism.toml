id = "occultism"
kind = "mod"
name = "Occultism for Horizon: Content"
summary = "The blocks, items, recipes and textures of the Occultism port. Needs Occultism for Horizon: Native Code to do anything."
description = """
The content half of an unofficial, alpha port of [Occultism](https://github.com/klikli-dev/occultism) by klikli-dev, made with klikli's permission. Please report problems [to this port](https://github.com/Dawnforger/occultism-horizon/issues), not to the Occultism team.

This file holds Occultism's blocks, items, recipes, loot, textures and spirit types. The rituals, the altar, storage, the spirits' behaviour and looks and everything else that acts are in the native half, **Occultism for Horizon: Native Code** (`occultism_native`). Install both, or the **Occultism for Horizon** modpack, which installs both.

The port ships as two files because current launchers build a one-file native mod without its content ([horizon-rust/horizon#15933](https://github.com/horizon-rust/horizon/issues/15933)). Occultism's code is MIT and some of its art is CC BY 3.0, credited in the source's NOTICE. It contains no Minecraft code or assets."""
authors = ["Dawnforger", "klikli-dev (Occultism)"]
owners = ["Dawnforger"]
owner_ids = [73370299]
license = "MIT AND CC-BY-3.0"
source = "https://github.com/Dawnforger/occultism-horizon"
icon = "icons/occultism.png"
categories = ["magic", "storage"]
tags = ["occultism", "rituals", "spirits", "chalk", "storage", "port", "alpha"]

