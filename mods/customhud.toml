changelog = """
1.8.0
- **Weather**: a small pixel cloud after the clock while it rains, with drops, snowflakes or a lightning bolt depending on the weather and the biome where you are (off by default).
- **Phantom warning**: after 3 days without sleep, a phantom membrane with the days since you last slept (the `time_since_rest` statistic, asked to the server every 10 seconds; on by default).
- **Milestone every**: Classic (50, 365, every 100) or a milestone every 10, 25, 50, 100, 250, 365, 500 or 1000 days.
- Simple mode now starts above the hotbar (50% / 77%), like the Java version.
- Built on Horizon nightly 2026-11-13 (9f42064), with the status bar height fix from thetechginger's PR; the logic is split into four modules."""

