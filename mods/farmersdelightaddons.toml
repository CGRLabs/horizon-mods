changelog = "27 new add-ons — ports of Brazilian Delight, Brewin' And Chewin', Chef's Delight, Collector's Reap, Corn Delight, Crabber's Delight, Delightful, Dumplings Delight Reload, Ender's Delight, Fright's Delight, Muffin's Thai Delight, Nether's Delight, Onion Onion, Storage Delight, Trail&Tales Delight, and twelve of our own (Backyard Grill, Clockwork Kitchen, Cutler's Rack, Deep Pantry, Eastern Table, Improv Kitchen, Infernal Kitchen, Odd Bites, Orchard Bounty, Pantry & Preserves, Table Setting, World Kitchen). Sub-settings: each of the 36 add-ons is split into 2–7 parts (197 in all: stations, crops and world generation, trees, food groups, effects, trades and loot, mob drops, village houses); a part switched off is really gone (recipes, stations, recipe viewers, guide, world generation, loot, trades, effects; placed containers still open), and a recipe is unavailable when its result or any ingredient belongs to a switched-off add-on or part. A new add-on manager: Core and Add-ons tabs, search, All on / All off, rows with icons and part counters, foldable parts, a scrolling details panel, a how-to tooltip from the guide, Reset / Cancel / Done; opens from Mod Menu's Configure or Options > Mods and fits any GUI scale. Add-on names stay English in Russian, Ukrainian, Belarusian and pre-reform Russian and are translated in 29 other languages. Animated how-tos (small live 3D scenes) in the tooltips of Farmer's Delight's knives, cutting board, cooking pot, skillet and stove, and in the book. The Farmer's Cookbook guide book (G) with a new cover; recipe-viewer categories for JEI, REI and EMI (from the book to a viewer and Esc brings you back to the book). Palms and the papaya tree redrawn with our own art after photos of real trees; palms now generate on beaches. Fixed: Rustic Delight's brewing recipes that never worked are removed and its golden coffee beans are now eaten for Haste (3:00); Collector's Reap's limes now appear in mineshaft chests (a loot condition the game didn't know); crafting with ingredients of switched-off add-ons; the camera after dying inside a station's scene; End's and Ender's chorus crates clashing over one recipe; Nether's Delight's blackstone furnace recipe giving a vanilla furnace. Also fixed (broken in 1.1.0 too): wild plants whose ground differs from their template block's (wild crops on sand, plants of the End) never generated, because the game checked their ground by the template's rule, and End's chorus succulents were skipped; wild rice generates for the first time; Expanded Delight's wild crops, cinnamon trees and salt ore never generated (unknown c: biome tags); mob drops that need a knife kill never dropped (old loot condition form); villager trades from Farmer's Delight and the add-ons never appeared, Expanded Delight's trades now follow its switch with the right uses and experience; the Backstabbing enchantment was never loaded and backstab did nothing; recipes that named undefined common tags had empty ingredients; Expanded Delight's cobbler and tart pies had broken models; tooltip colours were wrong."
