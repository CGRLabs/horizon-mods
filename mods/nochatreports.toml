id = "nochatreports"
kind = "native-mod"
name = "No Chat Reports"
summary = "Your chat goes out unsigned, so it can't be reported to Mojang. A 1:1 port of Aizistral's mod: signing modes, safety status, Safe Server icon, server side."
description = """
**A native Horizon mod**: the launcher builds it into the game (install it on the launcher's Mods page, then press Build there). Native mods are not sandboxed and run with your account's rights, so read the source before you build it. Built for Horizon Nightly 2026-11-13 (`9f42064`).

A 1:1 port of [No Chat Reports](https://github.com/Aizistral-Studios/No-Chat-Reports) by Aizistral (26.3-v2.21.0), under its licence, WTFPL. Horizon signs chat exactly like vanilla 26.3 does, with your Microsoft account's key: every signed message is evidence that can get you banned from all multiplayer. With this mod your messages and command arguments **go out unsigned** and can't be reported.

- **Signing modes**, globally or per server: Never, Always, **Prompt** (the default: if a server refuses unsigned chat, a "Chat Signing Requested" screen lets you allow signing for the session) and On Demand.
- **Safety status button** in the chat screen (Secure, Singleplayer, Unintrusive, Insecure, Realms, Unknown) with the original's icons and tooltips; click or scroll it to change the server's mode.
- **Safe Server icon** in the server list for servers that prevent chat reports, plus the **reload config** and **NCR on/off** buttons.
- **The server side too**, on your single player, LAN and dedicated Horizon servers: player messages become system messages with no signature, chat sessions are ignored, `enforce-secure-profile` is off, no "[Not Secure]" in the log, and the server tells clients it is safe. "Demand on client" kicks players without the mod.
- No more grey "Not Secure" / "Modified" bars, the Realms warning, the report button's tooltip, "Demand on server".
- **The original's config screen** (Cloth Config, Client and LAN tabs, every option) and its files in `config/NoChatReports/`; the original's icon, sprites and **English and Russian** texts; Mod Menu shows it.

Tested on LAN with two Horizon clients. Port by DeportedToHell. Source, issues and all our other mods: [MCRE-Mods](https://github.com/DeportedToHell/MCRE-Mods)."""
