summary = "The fireball, mushroom cloud, dust, flash and shockwave of the Realistic TNT native mod. Without the mod it leaves the picture as vanilla."
description = """The picture half of the **Realistic TNT** native mod: a white-hot fireball that cools as it rises into a mushroom cloud, a ring of dust along the ground, a flash, and a sphere of bent air racing out. It only draws what the mod hands it, so install the mod too. Over the game's vanilla look; one full-screen pass. The "Explosion flash" option at 0 removes the flash."""
