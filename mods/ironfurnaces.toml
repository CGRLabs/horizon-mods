id = "ironfurnaces"
kind = "mod"
name = "Iron Furnaces"
summary = "Upgraded furnaces, electric factories, generators and wireless heating for Horizon."
description = """
Iron Furnaces is an unofficial Rust port of Astryxion’s Iron Furnaces for Horizon. It adds thirteen furnace tiers, electric factories, generators, wireless heating, upgrades, augments, per-side automation, redstone controls, settings copying, seasonal skins and Rainbow Coal.

Factories, generators and wireless transmitters use Horizon’s shared ENERGY capability. Other Horizon native mods using that capability may interoperate, but specific third-party combinations are not tested; Forge Energy compatibility is not guaranteed.

Requires Minecraft 26.3 and the Horizon build at commit 9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0, with horizon-mixins 5a64af938ec86b00d53d16a408aabc0038fb3e57. Install this .hmod in horizon-mods and install the matching ironfurnaces-0.3.1.hnmod native companion from the GitHub release in horizon-native-mods; enable and build both. Use a disposable world before migrating a save.

Original Iron Furnaces credits and notices are retained. Distributed under Apache-2.0; this is an unofficial port with no endorsement claimed."""
