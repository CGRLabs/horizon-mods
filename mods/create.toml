id = "create"
kind = "native-mod"
name = "Create for Horizon"
summary = "Build rotating machines and small factories in Horizon with gears, belts, presses and fans."
description = """
An unofficial, experimental Rust port of [Create](https://github.com/Creators-of-Create/Create), maintained by Delete228. The original Create code is MIT and credited in the mod’s NOTICE.

Build factories with water wheels, shafts, belts and presses. Run a Precision Mechanism line with Deployers, pump fluids into multiblock tanks, or attach a saw and a chest to a rotating tree farm.

Install it as a native mod in Horizon Launcher and build the instance. Version 0.9.0 targets Horizon Nightly `9f42064` for Minecraft 26.3 and includes its own models and pixel textures.

**The original models and textures require the original Create 6.0.10 JAR for Minecraft 1.21.1 (NeoForge).** Place a copy in the instance’s `horizon-mods/create-resources/` folder and restart Horizon. The JAR is optional and its resources are imported locally. [Supported JAR](https://modrinth.com/mod/create/version/UjX6dr61)

[Setup and compatibility](https://github.com/Delete228/create-horizon)"""
