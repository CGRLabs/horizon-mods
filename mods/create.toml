changelog = """
### 0.9.0

- Build for the official Horizon Nightly `9f42064` (Minecraft 26.3).
- Build fluid networks with multiblock tanks, pumps, valves and open pipe ends.
- Move cargo with bearings, pistons, gantries and rope pulleys. Portable Storage Interfaces now animate as they dock.
- Improve machine processing and preserve drive settings across restarts.
- Include independent models and textures, with corrected scale for block items on the ground and in either hand. The optional local Create 6.0.10 JAR supplies the original art.

The native client was built on the pinned official Nightly. Checked startup with and without the original JAR, drive settings after restart, portable storage animation, and item scale on the ground and in hand. The archive matches commit `b99cab50ffdccdcc827e54d547b39c81a53efe11`."""

