id = "planar_worlds"
kind = "native-mod"
name = "Planar Worlds"
summary = "Play Minecraft as a 2D side-scrolling survival game with caves, mining, and background walls."
description = """
Planar Worlds turns the single-player Overworld in Horizon into a 2D side-scrolling survival game. Explore the surface, dig into caves, mine ores, and build with foreground blocks and walk-through background walls. Light fades into the terrain, keeping unlit ores hidden.

## Getting started

Build the native mod in the Horizon Launcher, then enable **Planar Mode** on the Create World screen.

- **A/D** moves left or right. **Space** jumps.
- Aim with the mouse. The outline marks the first block hit within reach.
- Hold **left-click** to mine. Use **right-click** to interact or place blocks. Hold right-click with a block in hand to build into reachable empty foreground cells.
- Hold **Ctrl** to target the background layer. Left-click breaks walls, and right-click places them.

Requires Horizon for Minecraft Java Edition **26.3** with native mod support. Planar Mode is available in the single-player Overworld. The tree generation fix applies to newly generated chunks."""
